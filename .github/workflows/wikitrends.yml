name: wikitrends-fetch
on:
  push:
    branches: [wiki-framing-research]
    paths: ['wikitrends/*.py', '.github/workflows/wikitrends.yml', 'wikitrends/RUN']
  workflow_dispatch:
permissions:
  contents: write
concurrency: wikitrends
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests numpy
      - name: Per-run secret salt for editor hashing (never written to disk or logs)
        run: echo "::add-mask::$(openssl rand -hex 16 | tee /tmp/salt)" && echo "WT_SALT=$(cat /tmp/salt)" >> $GITHUB_ENV && rm /tmp/salt
      - name: Restore raw cache
        uses: actions/cache/restore@v4
        with:
          path: wikitrends/data/articles
          key: wiki-raw-${{ hashFiles('wikitrends/corpus.py', 'wikitrends/fetch.py') }}-${{ github.run_id }}
          restore-keys: wiki-raw-
      - name: Fetch
        working-directory: wikitrends
        run: |
          python fetch.py --workers 4 > fetch.log 2> fetch_errors.log || echo "fetch exited $?"
          tail -n 15 fetch.log; echo ---; tail -n 60 fetch_errors.log
      - name: Save raw cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: wikitrends/data/articles
          key: wiki-raw-${{ hashFiles('wikitrends/corpus.py', 'wikitrends/fetch.py') }}-${{ github.run_id }}
      - name: Data acceptance tests
        working-directory: wikitrends
        run: python data_qa.py || echo "::warning::BLOCKING data QA check failed - see data/qa.json"
      - name: Analyze
        working-directory: wikitrends
        run: python analyze.py
      - name: Exploratory analyses
        working-directory: wikitrends
        run: python explore.py || echo "::warning::explore failed"
      - name: Trace first-sentence changes to exact revisions
        working-directory: wikitrends
        run: timeout 45m python trace_changes.py || echo "::warning::bisect incomplete"
      - name: Ratchet test (lead of every revision, key articles)
        working-directory: wikitrends
        run: timeout 50m python ratchet.py || echo "::warning::ratchet incomplete"
      - name: Cross-language mirror (same articles, other Wikipedias)
        working-directory: wikitrends
        run: timeout 40m python crosslang.py || echo "::warning::crosslang incomplete"
      - name: Organic vs organised editing signals
        working-directory: wikitrends
        run: python coordination.py || echo "::warning::coordination failed"
      - name: Commit results
        run: |
          git config user.name "wikitrends-bot"
          git config user.email "actions@users.noreply.github.com"
          cp wikitrends/fetch_errors.log wikitrends/data/ || true
          for f in results.json leads.json kwic.json qa.json bisect.json crosslang.json ratchet.json manifest.json fetch_errors.log; do [ -f wikitrends/data/$f ] && git add -f wikitrends/data/$f; done
          git commit -m "Update wikitrends results [skip ci]" || exit 0
          git pull --rebase origin wiki-framing-research && git push
