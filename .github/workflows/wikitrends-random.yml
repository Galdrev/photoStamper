name: wikitrends-random
# launch 2026-11-06
# Random-Wikipedia baseline (wikitrends/random_baseline.py): is the topic's lead change site-wide drift?
# sample (1 job, ~85 requests, ~2 min) -> 4 shards (max 4 at once, WT_RPS 2) -> merge + analyze
# -> orphan branch wikitrends-data/random/<run_id> + artifact.
# Estimate: ~3,500 rows x ~4.15 requests (3 leads + 1 pageviews + creation check for the ~15% without a 2021 lead)
# = ~14.5k requests, ~3.6k per shard: ~0.5 h per shard at 2 req/s, ~1 h at the ~1.0 effective req/s seen in mass2.
# A shard that hits its time budget keeps its checkpoint artifact; "Re-run failed jobs" resumes from it.
on:
  push:
    branches: [wikitrends-random]
permissions:
  contents: write
concurrency: wikitrends-random
defaults:
  run:
    shell: bash           # bash -eo pipefail: a failure anywhere in a pipe fails the step
env:
  WT_RPS: '2'
  GH_TOKEN: ${{ github.token }}
  N_SHARDS: '4'
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests numpy
      - name: Offline self-test (mocked API)
        working-directory: wikitrends
        run: python test_random_baseline.py 2>&1 | grep -v '^\[hb' | tail -40
      - name: Draw random articles (list=random, deduped, disambiguation excluded)
        working-directory: wikitrends
        run: mkdir -p logs && WT_JOB=random-sample timeout 20m python random_baseline.py sample 2>&1 | tee logs/sample.log
      - uses: actions/upload-artifact@v4
        with: {name: random-frame, path: wikitrends/data/random/frame.json, retention-days: 7}

  shard:
    needs: sample
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: {shard: [0, 1, 2, 3]}
    env:
      WT_JOB: random-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests numpy
      - name: Offline self-test (mocked API; fails fast before any network work)
        working-directory: wikitrends
        run: WT_JOB=random-test python test_random_baseline.py 2>&1 | grep -v '^\[hb' | tail -40
      - uses: actions/download-artifact@v4
        with: {name: random-frame, path: wikitrends/data/random/}
      - name: Resume from an earlier attempt of this run, if any
        continue-on-error: true
        uses: actions/download-artifact@v4
        with: {name: 'random-${{ matrix.shard }}', path: wikitrends/data/random/}
      - name: Start live status reporter
        run: mkdir -p wikitrends/logs && nohup .github/scripts/status_push.sh random-${{ matrix.shard }} 180 > /tmp/status.log 2>&1 &
      - name: Collect leads at 2021-01, 2023-07, now + pageviews (checkpointed; exits non-zero if >5% of rows error)
        working-directory: wikitrends
        run: |
          set +e
          timeout 180m python random_baseline.py shard --shard ${{ matrix.shard }} --of $N_SHARDS 2>&1 | tee logs/random.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" = "124" ]; then echo "::error::time budget hit; checkpoint kept - re-run this job to resume"; fi
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'random-${{ matrix.shard }}', path: 'wikitrends/data/random/rand_${{ matrix.shard }}.json.gz', retention-days: 7, overwrite: true}

  merge:
    needs: [sample, shard]
    if: always() && needs.sample.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests numpy
      - name: Offline self-test (mocked API)
        working-directory: wikitrends
        run: WT_JOB=random-test python test_random_baseline.py 2>&1 | grep -v '^\[hb' | tail -40
      - uses: actions/download-artifact@v4
        with: {name: random-frame, path: wikitrends/data/random/}
      - uses: actions/download-artifact@v4
        with: {path: wikitrends/data/random/, pattern: 'random-[0-9]*', merge-multiple: true}
      - name: Merge (fails if <95% of the frame arrived; results are pushed either way)
        working-directory: wikitrends
        run: python random_baseline.py merge 2>&1 | tee random_merge.log
      - name: Analyze against mass_narr.json and mass2.json.gz
        if: always()
        working-directory: wikitrends
        run: python random_baseline.py analyze 2>&1 | tee -a random_merge.log
      - name: Upload results as artifact (backup copy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: random-results
          retention-days: 14
          path: |
            wikitrends/data/random_baseline.json
            wikitrends/data/random_leads.json.gz
            wikitrends/data/random/frame.json
            wikitrends/patterns/sampling/random_baseline.md
            wikitrends/random_merge.log
      - name: Push to the data-only branch (wikitrends-data/random/<run_id>)
        if: always()
        run: |
          .github/scripts/push_data.sh random data/random_baseline.json data/random_leads.json.gz data/random/frame.json \
            patterns/sampling/random_baseline.md random_merge.log
