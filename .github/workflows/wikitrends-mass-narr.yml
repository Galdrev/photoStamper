name: wikitrends-mass-narr
# rev: fail-loud shards + empty-part fix (relaunch 2026-11-05)
on:
  push:
    branches: [wikitrends-mass-narr]
permissions:
  contents: write
concurrency: wikitrends-mass-narr
defaults:
  run:
    shell: bash
env:
  WT_RPS: '2'
  GH_TOKEN: ${{ github.token }}
jobs:
  narr:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: {shard: [0, 1, 2, 3]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests numpy
      - name: Start live status reporter
        run: mkdir -p wikitrends/logs && nohup .github/scripts/status_push.sh narr-${{ matrix.shard }} 180 > /tmp/status.log 2>&1 &
      - name: Collect leads at 2021-01 and now (checkpointed)
        working-directory: wikitrends
        run: WT_JOB=narr-${{ matrix.shard }} timeout 280m python mass_narr.py shard --shard ${{ matrix.shard }} --of 4 2>&1 | tee logs/narr.log || echo "::warning::stopped early; checkpoint kept"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'narr-${{ matrix.shard }}', path: 'wikitrends/data/mass/narr_${{ matrix.shard }}.json.gz', retention-days: 5, overwrite: true}
  analyze:
    needs: narr
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests numpy pandas statsmodels
      - uses: actions/download-artifact@v4
        with: {path: wikitrends/data/mass/, pattern: 'narr-*', merge-multiple: true}
      - working-directory: wikitrends
        run: |
          python mass_narr.py merge 2>&1 | tee mass_narr.log
          WT_JOB=wikidata python wikidata.py 2>&1 | tee -a mass_narr.log
          python cohere.py mass 2>&1 | tee -a mass_narr.log
      - name: Upload merged results as artifact (backup copy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass-narr-results
          retention-days: 7
          path: |
            wikitrends/data/mass_narr.json
            wikitrends/data/cohere_mass.json
            wikitrends/data/mass_leads.json.gz
            wikitrends/data/wikidata_types.json
            wikitrends/mass_narr.log
      - name: Push to the data-only branch (wikitrends-data/mass-narr/<run_id>)
        if: always()
        run: .github/scripts/push_data.sh mass-narr data/mass_narr.json data/cohere_mass.json data/mass_leads.json.gz data/wikidata_types.json mass_narr.log
