name: wikitrends-coord
# launch 2026-11-06
# Coordination collector (wikitrends/coord.py) + analysis (wikitrends/analyze_coord.py), in ONE job.
# Estimate (python coord.py estimate --of 1): 959 articles, 4,121 event revisions -> 967 metadata + 4,121 compare + <=1,004
# users = ~6.1k requests (~7.0k with the x1.15 retry calibration). One job at WT_RPS 2 with 3 worker threads: ~1.0-1.9
# effective req/s -> ~1.0-2.0 h collection, + ~15-25 min for the 1,000-draw nulls and 200 calibration worlds. Budget 5 h.
# Salt: one random value made in this job (openssl rand), masked, kept in env only: never a file, output or artifact.
# Privacy: the raw data (shard files, data/coord.json.gz: revids + per-account hashes, re-identifiable together) stays on
# the runner and is discarded with it. Only the aggregate outputs (patterns/coord/cards.md, cards.json, chart_data/*,
# incl. network.json with A1.. labels) are published, and only after the privacy gate (analyze_coord.py --scan) passes:
# no revid-like numbers, hash-like strings, diff URLs or id-like keys. A failed run cannot resume (no checkpoint artifact is
# kept, by design); a re-run starts over with a new salt.
on:
  push:
    branches: [wikitrends-coord]
permissions:
  contents: write
concurrency: wikitrends-coord
defaults:
  run:
    shell: bash
env:
  WT_RPS: '2'
  COORD_THREADS: '3'
  WT_JOB: coord
  GH_TOKEN: ${{ github.token }}
jobs:
  coord:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests numpy networkx
      - name: Offline self-test (mocked API, planted bloc, publication gate; fails before any network work)
        working-directory: wikitrends
        run: WT_JOB=coord-test python test_coord.py 2>&1 | grep -v '^\[hb' | tail -80
      - name: One run-wide salt (masked, env only)
        run: |
          SALT=$(openssl rand -hex 24)
          echo "::add-mask::$SALT"
          echo "WT_SALT=$SALT" >> "$GITHUB_ENV"
      - name: Plan (event revisions from mass2_events + ratchet; offline) and estimate
        working-directory: wikitrends
        run: python coord.py plan && python coord.py estimate --of 1
      - name: Start live status reporter
        run: mkdir -p wikitrends/logs && nohup .github/scripts/status_push.sh coord 180 > /tmp/status.log 2>&1 &
      - name: Collect (checkpointed on the runner; exits non-zero if >5% of articles or revisions error)
        working-directory: wikitrends
        run: |
          set +e
          timeout 270m python coord.py shard --shard 0 --of 1 2>&1 | tee logs/coord.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" = "124" ]; then echo "::error::time budget hit"; fi
          exit $rc
      - name: Merge (fails if <95% of articles or >5% revision errors)
        working-directory: wikitrends
        run: python coord.py merge 2>&1 | tail -40 | tee logs/coord_merge.log
      - name: Analyze (blocs, synchrony, sweeps, profiles, documented windows, network.json) + privacy gate
        working-directory: wikitrends
        run: python analyze_coord.py 2>&1 | tee logs/coord_analyze.log
      - name: Privacy gate on everything that will be published
        working-directory: wikitrends
        run: python analyze_coord.py --scan patterns/coord
      - name: Discard raw data before publishing
        if: always()
        working-directory: wikitrends
        run: rm -rf data/coord data/coord.json.gz data/coord_summary.json
      - name: Upload aggregate outputs as artifact
        uses: actions/upload-artifact@v4
        with: {name: coord-cards, path: wikitrends/patterns/coord/, retention-days: 14}
      - name: Push aggregate outputs to the data-only branch (wikitrends-data/coord/<run_id>)
        working-directory: wikitrends
        run: ../.github/scripts/push_data.sh coord patterns/coord
